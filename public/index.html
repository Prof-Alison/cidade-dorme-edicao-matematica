<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cidade Dorme - Edição Matemática</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );

            color: white;

        }

        .container {

            width: 100%;

            max-width: 500px;

        }

        .card {

            background: #ffffff;

            color: #1e293b;

            border-radius: 20px;

            padding: 35px 25px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.35);

            text-align: center;

        }

        h1 {

            font-size: 38px;

            margin-bottom: 8px;

        }

        h2 {

            font-size: 18px;

            color: #64748b;

            margin-bottom: 35px;

            font-weight: normal;

        }

        .pergunta {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 20px;

        }

        .opcoes {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }

        .btn {

            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 12px;

            font-size: 19px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform .15s ease,
                box-shadow .15s ease;

        }

        .btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 18px
                rgba(0,0,0,.18);

        }

        .btn-professor {

            background: #2563eb;

            color: white;

        }

        .btn-aluno {

            background: #16a34a;

            color: white;

        }

        .icone {

            font-size: 48px;

            margin-bottom: 10px;

        }

        .rodape {

            margin-top: 25px;

            color: #94a3b8;

            font-size: 13px;

        }

    </style>

</head>


<body>

    <main class="container">

        <section class="card">

            <div class="icone">
                🏙️
            </div>

            <h1>
                Cidade Dorme
            </h1>

            <h2>
                Edição Matemática
            </h2>


            <p class="pergunta">
                Como você vai entrar?
            </p>


            <div class="opcoes">

                <button
                    class="btn btn-professor"
                    onclick="entrarProfessor()"
                >
                    👨‍🏫 ENTRAR COMO PROFESSOR
                </button>


                <button
                    class="btn btn-aluno"
                    onclick="entrarAluno()"
                >
                    👨‍🎓 ENTRAR COMO ALUNO
                </button>

            </div>


            <p class="rodape">
    Jogo educativo de matemática 🚀
</p>

        </section>

    </main>


    <script>

        function entrarProfessor() {

            window.location.href =
                "professor.html";

        }


        function entrarAluno() {

            window.location.href =
                "aluno.html";

        }

    </script>

</body>

</html>
